[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Kalshi market data client and strategy advisor"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "rich>=13",          # pretty tables / CLI output
    "typer>=0.12",       # CLI framework
    "pandas>=2.0",       # data manipulation
    "aiohttp>=3.9",      # async WebSocket support
]

[project.scripts]
kalshi = "kalshi_bot.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-dir]
"" = "."
