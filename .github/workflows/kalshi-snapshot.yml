name: Kalshi Snapshot

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/kalshi-bot-setup-4xG92
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx cryptography

      - name: Debug auth
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          python3 - << 'EOF'
          import os, time, base64, httpx
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding as asym_padding

          raw = os.environ["KALSHI_PRIVATE_KEY"].strip()
          if not raw.startswith("-----"):
              raw = base64.b64decode(raw).decode()
          key = serialization.load_pem_private_key(raw.encode(), password=None)
          key_id = os.environ["KALSHI_API_KEY_ID"]
          url = "https://trading-api.kalshi.com/trade-api/v2/exchange/status"

          def try_it(label, path_for_sig, ts_fn):
              ts = ts_fn()
              msg = f"{ts}GET{path_for_sig}".encode()
              sig = base64.b64encode(key.sign(msg, asym_padding.PKCS1v15(), hashes.SHA256())).decode()
              r = httpx.get(url, headers={
                  "KALSHI-ACCESS-KEY": key_id,
                  "KALSHI-ACCESS-TIMESTAMP": str(ts),
                  "KALSHI-ACCESS-SIGNATURE": sig,
              }, timeout=10)
              print(f"{label:50s}  HTTP {r.status_code}  {r.text[:60]}")

          ms = lambda: int(time.time() * 1000)
          sec = lambda: int(time.time())

          try_it("ms  + /trade-api/v2/exchange/status", "/trade-api/v2/exchange/status", ms)
          try_it("ms  + /exchange/status",              "/exchange/status",               ms)
          try_it("sec + /trade-api/v2/exchange/status", "/trade-api/v2/exchange/status", sec)
          try_it("sec + /exchange/status",              "/exchange/status",               sec)
          EOF

      - name: Fetch Kalshi snapshot
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_ENV: prod
        run: python scripts/snapshot.py -o data/snapshot.txt

      - name: Commit and push snapshot
        run: |
          git config user.name  "kalshi-bot"
          git config user.email "bot@kalshi"
          git add data/snapshot.txt
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update kalshi snapshot [skip ci]"
          git pull --rebase origin claude/kalshi-bot-setup-4xG92
          git push origin claude/kalshi-bot-setup-4xG92
