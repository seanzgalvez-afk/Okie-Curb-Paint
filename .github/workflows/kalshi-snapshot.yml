name: Kalshi Snapshot

on:
  push:
    branches:
      - claude/kalshi-bot-setup-4xG92
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/kalshi-bot-setup-4xG92
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install httpx cryptography

      - name: Fetch snapshot
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: .keys/pk.pem
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/snapshot.py -o data/snapshot.txt

      - name: Run demo trader
        env:
          KALSHI_DEMO_API_KEY_ID: ${{ secrets.KALSHI_DEMO_API_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
          KALSHI_DEMO_BANKROLL: "100000"
        run: python scripts/demo_trader.py || echo "Demo trader skipped (no credentials)"

      - name: Commit and push
        run: |
          git config user.name  "kalshi-bot"
          git config user.email "bot@kalshi"
          git add data/snapshot.txt docs/data.json data/demo_trades.json || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update kalshi snapshot [skip ci]"
            git pull --rebase origin claude/kalshi-bot-setup-4xG92
            git push origin claude/kalshi-bot-setup-4xG92
          fi

      - name: Send push notification if edges found
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "No NTFY_TOPIC set, skipping notification"
            exit 0
          fi
          # Count edges in data.json
          EDGE_COUNT=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('docs/data.json'))
              edges = data.get('edges', [])
              big = [e for e in edges if abs(e.get('gap',0)) >= 10]
              print(len(big))
          except:
              print(0)
          ")
          if [ "$EDGE_COUNT" -gt "0" ]; then
            # Get top edge details
            TOP_EDGE=$(python3 -c "
          import json
          try:
              data = json.load(open('docs/data.json'))
              edges = sorted(data.get('edges',[]), key=lambda x: abs(x.get('gap',0)), reverse=True)
              big = [e for e in edges if abs(e.get('gap',0)) >= 10]
              if big:
                  e = big[0]
                  print(f\"{e['direction']} {e['ticker'][:20]} | Kalshi {e['kalshi_price']}c vs Vegas {e['vegas_prob']}c | Gap: {e['gap']:+.0f}c\")
          except Exception as ex:
              print('Edge detected')
            ")
            curl -s \
              -H "Title: 🚨 Kalshi Edge Alert" \
              -H "Priority: high" \
              -H "Tags: chart_increasing" \
              -d "$TOP_EDGE" \
              "https://ntfy.sh/$NTFY_TOPIC" || true
          fi


