name: Kalshi Snapshot

on:
  push:
    branches:
      - claude/kalshi-bot-setup-4xG92
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/kalshi-bot-setup-4xG92
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install httpx cryptography

      - name: Fetch snapshot
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: .keys/pk.pem
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/snapshot.py -o data/snapshot.txt

      - name: Run demo trader
        env:
          KALSHI_DEMO_API_KEY_ID: ${{ secrets.KALSHI_DEMO_API_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
          KALSHI_DEMO_BANKROLL: "100000"
        run: python scripts/demo_trader.py || echo "Demo trader skipped (no credentials)"

      - name: Commit and push
        run: |
          git config user.name  "kalshi-bot"
          git config user.email "bot@kalshi"
          git add data/snapshot.txt docs/data.json data/demo_trades.json data/price_history.json || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update kalshi snapshot [skip ci]"
            git pull --rebase origin claude/kalshi-bot-setup-4xG92
            git push origin claude/kalshi-bot-setup-4xG92
          fi

      - name: Send push notification if edges found
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "No NTFY_TOPIC set, skipping notification"
            exit 0
          fi
          python3 - <<'PYEOF'
import json, subprocess, sys, os

topic = os.environ["NTFY_TOPIC"]

try:
    data = json.load(open("docs/data.json"))
except Exception as e:
    print(f"Could not read data.json: {e}")
    sys.exit(0)

alerts = []

# 1) Vegas edges ≥10c
edges = data.get("edges", [])
big_edges = [e for e in edges if abs(e.get("gap", 0)) >= 10]
if big_edges:
    e = big_edges[0]
    alerts.append({
        "title": "🚨 Vegas Edge Alert",
        "priority": "high",
        "tags": "chart_increasing",
        "body": f"{e['direction']} {e['ticker'][:20]} | Kalshi {e['kalshi_price']}c vs Vegas {e['vegas_prob']}c | Gap: {e['gap']:+.0f}c",
    })

# 2) High-confidence strategy signals
sigs = data.get("strategy_signals", [])
high = [s for s in sigs if s.get("confidence") == "high"]
if high:
    s = high[0]
    sig_type = s.get("type") or s.get("signal_type") or "?"
    kelly_pct = s.get("kelly_pct") or round((s.get("kelly_frac") or 0) * 100, 1)
    entry = s.get("entry_limit_cents")
    tp = s.get("take_profit_cents")
    entry_str = f" | Entry {entry}c→TP {tp}c" if entry and tp else ""
    alerts.append({
        "title": "⚡ Strategy Signal",
        "priority": "high",
        "tags": "zap",
        "body": f"{s.get('direction','?')} {s.get('ticker','')[:20]} | {sig_type} | Kelly {kelly_pct:.1f}%{entry_str} | {s.get('rationale','')[:60]}",
    })

# 3) Sharp line movements ≥5 pts
moves = data.get("line_movements", [])
big_moves = [m for m in moves if abs(m.get("prob_move", 0)) >= 5]
if big_moves:
    m = big_moves[0]
    alerts.append({
        "title": "📈 Sharp Line Move",
        "priority": "default",
        "tags": "eyes",
        "body": f"{m['team']} ({m.get('sport','')}) {m['direction']} {m['prob_move']:+.1f}pts | {m['away']} @ {m['home']}",
    })

if not alerts:
    print("No alerts to send")
    sys.exit(0)

for alert in alerts:
    result = subprocess.run([
        "curl", "-s",
        "-H", f"Title: {alert['title']}",
        "-H", f"Priority: {alert['priority']}",
        "-H", f"Tags: {alert['tags']}",
        "-d", alert["body"],
        f"https://ntfy.sh/{topic}",
    ], capture_output=True, text=True)
    print(f"Sent: {alert['title']} -> {result.returncode}")
PYEOF

